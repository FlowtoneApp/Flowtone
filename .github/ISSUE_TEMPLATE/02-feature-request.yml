
name: "功能建议"
description: "提出新功能或现有体验的改进建议"
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 目前遇到了什么不便？
      placeholder: 描述你希望解决的问题
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的功能
      description: 你希望 Flowtone 如何实现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否考虑过其他实现方式？

  - type: textarea
    id: additional
    attributes:
      label: 补充资料
      description: 可以提供截图、设计稿或参考链接
